[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astral-pins"
version = "0.1.0"
description = "Per-pin 12V-2x6 power monitor for ASUS ROG Astral RTX 50-series cards (IT8915FN over I2C), GTK4"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Zac Lanzon", email = "lanzonza@gmail.com" }]
requires-python = ">=3.10"
keywords = ["nvidia", "asus", "astral", "12v-2x6", "12vhpwr", "i2c", "smbus", "hwmon", "gtk4"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: System :: Monitoring",
]
# GTK bindings come from the distro (python3-gi / gir1.2-gtk-4.0), not PyPI —
# building PyGObject from source needs a toolchain and GTK dev headers.
# Install with: pipx install --system-site-packages .
dependencies = []

[project.urls]
Homepage = "https://github.com/zaclanzon/astral-pins"

[project.scripts]
astral-pins = "astral_pins:main"

[tool.setuptools]
py-modules = ["astral_pins"]
