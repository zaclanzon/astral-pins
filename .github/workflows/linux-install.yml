name: Linux installation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 22.04 (Python 3.10)
            image: ubuntu:22.04
            packages: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-gi python3-gi-cairo gir1.2-gtk-4.0
          - distro: Debian stable
            image: debian:stable
            packages: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-gi python3-gi-cairo gir1.2-gtk-4.0
          - distro: Fedora
            image: fedora:latest
            packages: dnf install -y python3 python3-gobject gtk4
          - distro: Arch Linux
            image: archlinux:latest
            packages: pacman -Syu --noconfirm python python-gobject python-cairo gtk4
          - distro: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            packages: zypper --non-interactive install python3 python3-gobject python3-gobject-Gdk typelib-1_0-Gtk-4_0 libgtk-4-1
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution packages
        run: ${{ matrix.packages }}
      - name: Check dependencies and installer
        run: |
          python3 install.py --check
          python3 -m unittest discover -s tests -p test_install.py -v
          python3 install.py --prefix /tmp/astral-install
          /tmp/astral-install/bin/astral-pins --help

  gtk:
    name: GTK integration and packaging
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 python3-pip xvfb desktop-file-utils
      - name: Run tests and build wheel
        run: |
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
          /usr/bin/python3 install.py --prefix /tmp/astral-install
          desktop-file-validate /tmp/astral-install/share/applications/astral-pins.desktop
          /usr/bin/python3 -m pip wheel --no-deps --wheel-dir /tmp/wheels .
